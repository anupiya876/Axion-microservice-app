trigger:
  branches:
    include: [main]
  paths:
    include: [axion-telemetry-query-service/*]   

pr: none

variables:
- group: axion-telemetry-secrets

stages:
- template: /ADO-pipeline/templates/service-pipeline.yaml
  parameters:
    servicePath: axion-telemetry-query-service
    imageRepo: axion-telemetry-query
    extraHelmSetArgs: '--set secretData.DATABASE_URL=$(DATABASE_URL)'