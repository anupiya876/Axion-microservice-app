parameters:
- name: servicePath             # folder containing the helm/ chart, e.g. axion-database
  type: string
- name: releaseName             # helm release name
  type: string
- name: armConnection          # Azure Resource Manager service connection
  type: string
  default: 'azure-axion-connection'
- name: aksResourceGroup
  type: string
  default: 'rg-aks-env'
- name: aksName
  type: string
  default: 'test-aks-anu'
- name: extraHelmSetArgs        # extra --set flags, e.g. for secret values from a variable group
  type: string
  default: ''

stages:
- stage: Deploy
  jobs:
  - deployment: DeployManifests
    environment: axion-dev
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: HelmInstaller@1
            inputs:
              helmVersionToInstall: 4.3.0

          - task: KubeloginInstaller@0
            inputs:
              gitHubConnection: 'github-pat-connection'
            env:
              USE_AUTHORIZATION_FOR_API_CALL: true

          - task: AzureCLI@2
            displayName: Helm deploy ${{ parameters.releaseName }}
            inputs:
              azureSubscription: ${{ parameters.armConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az aks get-credentials \
                  --resource-group ${{ parameters.aksResourceGroup }} \
                  --name ${{ parameters.aksName }} \
                  --overwrite-existing

                cd $(Build.SourcesDirectory)/${{ parameters.servicePath }}/helm
                helm dependency build .
                helm upgrade --install ${{ parameters.releaseName }} . \
                  --namespace default \
                  ${{ parameters.extraHelmSetArgs }} \
                  --atomic --timeout 5m