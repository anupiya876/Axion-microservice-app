name: CI

on:
  workflow_dispatch:

permissions:
  contents: read                          
  id-token: write 

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true                 

    
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: ingestion
          path: axion-ingestion-service
        - name: telemetry-query
          path: axion-telemetry-query-service
        - name: ui
          path: axion-ui

    env:
      IMAGE: axion-${{ matrix.name }}
      TAG: ${{ github.sha }} 
      ACR: ${{ vars.ACR_NAME }}.azurecr.io              
    
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image (kept local for scanning)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.path }}
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          
      - name: Scan for vulnerabilities  
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Azure login (OIDC)
        if: github.ref == 'refs/heads/main'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}  
          
      - name: Push to ACR
        if: github.ref == 'refs/heads/main' 
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"
          REMOTE="${{ vars.ACR_NAME }}.azurecr.io/${IMAGE}:${TAG}"
          docker tag "${IMAGE}:${TAG}" "$REMOTE"
          docker push "$REMOTE" 