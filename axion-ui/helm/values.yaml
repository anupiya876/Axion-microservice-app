appName: axion-ui

image:
  repository: anuacr.azurecr.io/axion-ui
  tag: v2

replicas: 2
port: 80

resources:
  requests:
    memory: "120Mi"
    cpu: "50m"
  limits:
    memory: "128Mi"
    cpu: "200m"

service:
  type: ClusterIP
  port: 80
  targetPort: 80

ingress:
  host: axion.anupiyasingh.world

hpa:
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilization: 60
  scaleUp:
    stabilizationWindowSeconds: 0
    percentValue: 100
    periodSeconds: 60
  scaleDown:
    stabilizationWindowSeconds: 300
    percentValue: 50
    percentPeriodSeconds: 100
    podsValue: 1
    podsPeriodSeconds: 120
