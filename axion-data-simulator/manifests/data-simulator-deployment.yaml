apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator-deployment
  labels:
    app: simulator-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simulator-service
  template:
    metadata:
      labels:
        app: simulator-service
    spec:
      nodeSelector: 
        kubernetes.azure.com/agentpool: anunode
      containers:
      - name: simulator-container
        image: anuacr.azurecr.io/axion-data-simulator:v1
        envFrom:
        - configMapRef:
            name: simulator-config
        resources:
          requests:
            memory: "120Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "50m"
        ports:
        - containerPort: 8000
