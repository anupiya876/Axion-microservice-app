appName: simulator

image:
  repository: anuacr.azurecr.io/axion-data-simulator
  tag: v1

replicas: 1

resources:
  requests:
    memory: "120Mi"
    cpu: "50m"
  limits:
    memory: "128Mi"
    cpu: "50m"

configMapRef: simulator-config

configMapName: simulator-config
configMapData:
  LOG_LEVEL: "info"
  API_URL: "http://ingestion-service:8095/api/v1/telemetry/ingest"
  INTERVAL_SECONDS: "5"