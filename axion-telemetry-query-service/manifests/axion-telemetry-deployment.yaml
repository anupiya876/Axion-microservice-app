apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-query-deployment
  labels:
    app: telemetry-query
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetry-query
  template:
    metadata:
      labels:
        app: telemetry-query
    spec:
      nodeSelector: 
        kubernetes.azure.com/agentpool: anunode
      containers:
      - name: telemetry-query-container
        image: anuacr.azurecr.io/axion-telemetry-query:v1
        env:
          - name: DATABASE_URL
            value: "postgresql://admin:admin123@axion-postgres-service:5432/axiondb"
        resources:
          requests:
            memory: "120Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "250m"
        ports:
        - containerPort: 8000
